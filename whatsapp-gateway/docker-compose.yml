services:
  whatsapp-service:
    build:
      context: ./whatsapp-service
    container_name: whatsapp-service
    ports:
      - "8788:8788"
    volumes:
      - whatsapp-auth:/app/.wwebjs_auth
    tmpfs:
      - /tmp/chromium-data:rw,noexec,nosuid,size=512m
    shm_size: '2gb'
    restart: unless-stopped
    networks:
      - whatsapp-network

volumes:
  whatsapp-auth:
    name: whatsapp-gateway_whatsapp-auth

networks:
  whatsapp-network:
    name: whatsapp-gateway_whatsapp-network
    driver: bridge 