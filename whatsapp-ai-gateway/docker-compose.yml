version: '3'

services:
  whatsapp-service:
    build:
      context: ./whatsapp-service
    container_name: whatsapp-service
    environment:
      - DEEPINFRA_API_KEY=${DEEPINFRA_API_KEY}
    ports:
      - "8788:8788"
    volumes:
      - whatsapp-auth:/app/.wwebjs_auth
      - shared-data-volume:/app/data
    restart: unless-stopped
    networks:
      - whatsapp-network

  upload-service:
    build:
      context: ./upload-service
    container_name: upload-service
    environment:
      - WHATSAPP_SERVICE_URL=http://whatsapp-service:8788
    ports:
      - "8789:8789"
    volumes:
      - shared-data-volume:/app/data
    restart: unless-stopped
    networks:
      - whatsapp-network
    depends_on:
      - whatsapp-service

volumes:
  whatsapp-auth:
  shared-data-volume:

networks:
  whatsapp-network:
    driver: bridge 