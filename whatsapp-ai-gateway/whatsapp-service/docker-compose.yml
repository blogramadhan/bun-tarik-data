version: '3'

services:
  whatsapp-service:
    build:
      context: .
    container_name: whatsapp-service
    environment:
      - DEEPINFRA_API_KEY=${DEEPINFRA_API_KEY}
    ports:
      - "8788:8788"
    volumes:
      - whatsapp-auth:/app/.wwebjs_auth
      - data-volume:/app/data
    restart: unless-stopped
    networks:
      - whatsapp-network

volumes:
  whatsapp-auth:
  data-volume:

networks:
  whatsapp-network:
    driver: bridge 